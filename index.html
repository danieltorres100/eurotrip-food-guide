<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurotrip Food Guide</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #f59e0b;
            --subtext: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            margin: 0;
            color: #ffffff;
        }
        p.subtitle {
            color: var(--subtext);
            font-size: 14px;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
        }
        input, select {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .card-body {
            padding: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 19px;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
        }
        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            background-color: #3b82f6;
            color: white;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .badge-budget {
            background-color: #10b981;
        }
        .badge-score {
            background-color: #8b5cf6;
        }
        .city {
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .note {
            color: #cbd5e1;
            font-size: 14px;
            margin: 10px 0 16px 0;
            line-height: 1.5;
        }
        .btn-maps {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #e11d48;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🥐 Eurotrip Food Guide</h1>
        <p class="subtitle">Guía de joyas gastronómicas por Europa</p>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Buscar platillo, lugar o nota..." oninput="filterSpots()">
        <select id="cityFilter" onchange="filterSpots()">
            <option value="">🌍 Todas las ciudades</option>
            <option value="París">París 🇫🇷</option>
            <option value="Lyon">Lyon 🇫🇷</option>
            <option value="Bologna">Bolonia 🇮🇹</option>
            <option value="Donostia-San Sebastián">Donostia-San Sebastián 🇪🇸</option>
            <option value="Barcelona">Barcelona 🇪🇸</option>
            <option value="Madrid">Madrid 🇪🇸</option>
            <option value="Ginebra">Ginebra 🇨🇭</option>
        </select>
    </div>

    <div class="grid" id="spotsGrid"></div>

    <script>
        const spots = [
            {
                name: "L'As du Fallafel",
                city: "París",
                budget: "Mochilero (€10-15)",
                type: "Street Food",
                score: "★ 4.8",
                img: "https://images.unsplash.com/photo-1593001874117-c99c800e3eb7?auto=format&fit=crop&w=600&q=80",
                note: "El pita falafel legendario en el corazón de Le Marais. Rápido, abundante e insuperable.",
                maps: "https://maps.google.com/?q=L'As+du+Fallafel+Paris"
            },
            {
                name: "Café de Flore",
                city: "París",
                budget: "Medio (€20-30)",
                type: "Café & Pastelería",
                score: "★ 4.5",
                img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80",
                note: "Ícono parisino en Saint-Germain-des-Prés. Ideal para chocolate caliente y croissants con vista.",
                maps: "https://maps.google.com/?q=Cafe+de+Flore+Paris"
            },
            {
                name: "Osteria dell'Orsa",
                city: "Bologna",
                budget: "Mochilero (€12-18)",
                type: "Pasta Fresca / Taverna",
                score: "★ 4.9",
                img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281288?auto=format&fit=crop&w=600&q=80",
                note: "La auténtica Tagliatelle al Ragù boloñés en ambiente universitario y rústico.",
                maps: "https://maps.google.com/?q=Osteria+dell'Orsa+Bologna"
            },
            {
                name: "Bar Ganbara",
                city: "Donostia-San Sebastián",
                budget: "Medio (€20-35)",
                type: "Pintxos & Vino",
                score: "★ 4.9",
                img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=600&q=80",
                note: "Referente absoluto de pintxos en la Parte Vieja. Hongos con yema de huevo y tarta de queso.",
                maps: "https://maps.google.com/?q=Bar+Ganbara+San+Sebastian"
            },
            {
                name: "Bouchon Comptoir Brunet",
                city: "Lyon",
                budget: "Medio (€25-35)",
                type: "Tradicional Lionesa",
                score: "★ 4.7",
                img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80",
                note: "Bouchon histórico en la capital gastronómica de Francia. Quenelles de brochet imperdibles.",
                maps: "https://maps.google.com/?q=Comptoir+Brunet+Lyon"
            },
            {
                name: "El Xampanyet",
                city: "Barcelona",
                budget: "Económico (€15-25)",
                type: "Tapas & Cava",
                score: "★ 4.8",
                img: "https://images.unsplash.com/photo-1515443961218-a51367888e4b?auto=format&fit=crop&w=600&q=80",
                note: "Taberna tradicional en El Born. Anchoas de la escala, mariscos en conserva y cava de la casa.",
                maps: "https://maps.google.com/?q=El+Xampanyet+Barcelona"
            },
            {
                name: "Casa Labra",
                city: "Madrid",
                budget: "Mochilero (€5-12)",
                type: "Tapas / Taberna",
                score: "★ 4.7",
                img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80",
                note: "Famosa por sus tajadas de bacalao rebozado y croquetas desde 1860, al lado de Sol.",
                maps: "https://maps.google.com/?q=Casa+Labra+Madrid"
            }
        ];

        function renderSpots(data) {
            const container = document.getElementById('spotsGrid');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--subtext); padding: 40px 0;">No se encontraron lugares con esos filtros.</p>';
                return;
            }

            data.forEach(spot => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${spot.img}" class="card-img" alt="${spot.name}">
                    <div class="card-body">
                        <div class="card-header">
                            <h2 class="card-title">${spot.name}</h2>
                            <div class="badges">
                                <span class="badge badge-score">${spot.score}</span>
                                <span class="badge badge-budget">${spot.budget}</span>
                            </div>
                        </div>
                        <div class="city">📍 ${spot.city} • ${spot.type}</div>
                        <p class="note">${spot.note}</p>
                        <a href="${spot.maps}" target="_blank" class="btn-maps">🗺️ Abrir en Google Maps</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterSpots() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const city = document.getElementById('cityFilter').value;

            const filtered = spots.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(search) || 
                                      s.note.toLowerCase().includes(search) ||
                                      s.type.toLowerCase().includes(search);
                const matchesCity = city === "" || s.city === city;
                return matchesSearch && matchesCity;
            });

            renderSpots(filtered);
        }

        renderSpots(spots);
    </script>
</body>
</html>

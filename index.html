<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurotrip Food Guide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-orange: #f59e0b;
            --border-color: #334155;
            --badge-green: #10b981;
            --badge-purple: #8b5cf6;
            --button-red: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .sticky-search {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            padding: 8px 0 12px 0;
            z-index: 50;
        }

        .search-box, .select-box {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        .trails-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin: 8px 0 6px 0;
        }

        .trail-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .trail-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .chip.active {
            background-color: var(--accent-orange);
            color: #0f172a;
            font-weight: 700;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #334155;
        }

        .card-content {
            padding: 16px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .badge-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            color: #ffffff;
        }

        .badge-score { background-color: var(--badge-purple); }
        .badge-budget { background-color: var(--badge-green); }

        .card-city {
            color: var(--accent-orange);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 14px;
        }

        .btn-maps {
            display: block;
            width: 100%;
            background-color: var(--button-red);
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .no-results {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🥐 Eurotrip Food Guide</h1>
        <p>Bite Europe • Recomendaciones y Food Trails</p>
    </div>

    <div class="sticky-search">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar ciudad, platillo o lugar..." oninput="filterData()">
        
        <select id="citySelect" class="select-box" onchange="filterData()">
            <option value="">🌍 Todas las ciudades de Europa</option>
            <option value="París">París 🇫🇷</option>
            <option value="Lyon">Lyon 🇫🇷</option>
            <option value="Ginebra">Ginebra 🇨🇭</option>
            <option value="Bruselas">Bruselas 🇧🇪</option>
            <option value="Brujas">Brujas 🇧🇪</option>
            <option value="Roma">Roma 🇮🇹</option>
            <option value="Bologna">Bolonia 🇮🇹</option>
            <option value="Florencia">Florencia 🇮🇹</option>
            <option value="Milán">Milán 🇮🇹</option>
            <option value="Venecia">Venecia 🇮🇹</option>
            <option value="Barcelona">Barcelona 🇪🇸</option>
            <option value="Madrid">Madrid 🇪🇸</option>
            <option value="San Sebastián">Donostia-San Sebastián 🇪🇸</option>
            <option value="Praga">Praga 🇨🇿</option>
            <option value="Budapest">Budapest 🇭🇺</option>
            <option value="Zagreb">Zagreb 🇭🇷</option>
            <option value="Dubrovnik">Dubrovnik 🇭🇷</option>
        </select>

        <div class="trails-label">TRY A FOOD TRAIL</div>
        <div class="trail-chips">
            <div class="chip active" onclick="setTrail(this, '')">Todos</div>
            <div class="chip" onclick="setTrail(this, 'Fresh Pasta')">🍝 Fresh Pasta</div>
            <div class="chip" onclick="setTrail(this, 'Warm Pastries')">🥐 Warm Pastries</div>
            <div class="chip" onclick="setTrail(this, 'Pintxos & Tapas')">🍢 Pintxos & Tapas</div>
            <div class="chip" onclick="setTrail(this, 'Wine & Bites')">🍷 Wine & Bites</div>
            <div class="chip" onclick="setTrail(this, 'Street Food')">🥙 Street Food</div>
            <div class="chip" onclick="setTrail(this, 'Local Classics')">🍲 Local Classics</div>
        </div>
    </div>

    <div class="cards-container" id="cardsContainer"></div>

            {

                maps: "https://maps.google.com/?q=Trattoria+ZaZa+Florence"

            {

                trail: "Pintxos & Tapas",

                img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=600&q=80",

            {

                note: "Sol. Taberna de 1860 especializada en croquetas de bacalao.",

            },
            {

                city: "Praga",

                score: "★ 4.7",
                img: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=600&q=80",
                note: "Ciudad Vieja. Cervecera tradicional checa con goulash casero y Pilsner de tanque.",

            },
            {
                name: "Get Gulyas",
                city: "Budapest",
                trail: "Local Classics",
                budget: "Económico (€12-20)",
                score: "★ 4.8",
                img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80",
                note: "Barrio Judío. La sopa Goulash tradicional húngara y pörkölt artesanal.",
                maps: "https://maps.google.com/?q=Get+Gulyas+Budapest"
            },
            {
                name: "Konoba Kamenice",
                city: "Dubrovnik",
                trail: "Wine & Bites",
                budget: "Medio (€20-35)",
                score: "★ 4.7",
                img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80",
                note: "Old Town. Mariscos frescos del Adriático, calamares a la parrilla y ostras.",
                maps: "https://maps.google.com/?q=Konoba+Kamenice+Dubrovnik"
            }
        ];

        function setTrail(element, trailName) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            selectedTrail = trailName;
            filterData();
        }

        function renderCards(items) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = '<div class="no-results">No se encontraron lugares con los filtros seleccionados.</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.img}" class="card-image" alt="${item.name}">
                    <div class="card-content">
                        <div class="card-top">
                            <h2 class="card-title">${item.name}</h2>
                            <div class="badge-group">
                                <span class="badge badge-score">${item.score}</span>
                                <span class="badge badge-budget">${item.budget}</span>
                            </div>
                        </div>
                        <div class="card-city">📍 ${item.city} • ${item.trail}</div>
                        <p class="card-description">${item.note}</p>
                        <a href="${item.maps}" target="_blank" class="btn-maps">🗺️ Abrir en Google Maps</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedCity = document.getElementById('citySelect').value;

            const filtered = foodData.filter(item => {
                const matchesQuery = !query || 
                                     item.name.toLowerCase().includes(query) ||
                                     item.note.toLowerCase().includes(query) ||
                                     item.city.toLowerCase().includes(query) ||
                                     item.trail.toLowerCase().includes(query);

                const matchesCity = !selectedCity || item.city === selectedCity;
                const matchesTrail = !selectedTrail || item.trail === selectedTrail;

                return matchesQuery && matchesCity && matchesTrail;
            });

            renderCards(filtered);
        }

        // Renderizado automático
        renderCards(foodData);
    </script>
</body>
</html>

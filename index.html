<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurotrip Food Guide</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #f59e0b;
            --subtext: #94a3b8;
            --border: #334155;
            --chip-bg: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .header {
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            margin: 0;
            color: #ffffff;
        }
        p.subtitle {
            color: var(--subtext);
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 0;
        }
        .sticky-tools {
            position: sticky;
            top: 0px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 0;
            backdrop-filter: blur(10px);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, select {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }
        .trails-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--subtext);
            margin: 14px 0 8px 0;
            font-weight: 700;
        }
        .chips-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .chips-scroll::-webkit-scrollbar {
            display: none;
        }
        .chip {
            background-color: var(--chip-bg);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .chip.active {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        .card-img {
            width: 100%;
            height: 165px;
            object-fit: cover;
        }
        .card-body {
            padding: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
        }
        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            color: white;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .badge-budget { background-color: #10b981; }
        .badge-score { background-color: #8b5cf6; }
        .city {
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .note {
            color: #cbd5e1;
            font-size: 14px;
            margin: 8px 0 14px 0;
            line-height: 1.45;
        }
        .btn-maps {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #e11d48;
            color: white;
            text-decoration: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>

        function selectTrail(el, trail) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentTrail = trail;
            filterSpots();
        }

        function renderSpots(data) {
            const container = document.getElementById('spotsGrid');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--subtext); padding: 40px 0;">No hay lugares registrados para esta selección.</p>';
                return;
            }

            data.forEach(spot => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${spot.img}" class="card-img" alt="${spot.name}">
                    <div class="card-body">
                        <div class="card-header">
                            <h2 class="card-title">${spot.name}</h2>
                            <div class="badges">
                                <span class="badge badge-score">${spot.score}</span>
                                <span class="badge badge-budget">${spot.budget}</span>
                            </div>
                        </div>
                        <div class="city">📍 ${spot.city} • ${spot.trail}</div>
                        <p class="note">${spot.note}</p>
                        <a href="${spot.maps}" target="_blank" class="btn-maps">🗺️ Abrir en Google Maps</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

            const city = document.getElementById('cityFilter').value;

            const filtered = spots.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(search) || 
                                      s.note.toLowerCase().i

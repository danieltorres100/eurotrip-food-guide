<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurotrip Food Budget Guide</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-inner: #262626;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-blue: #3b82f6;
            --border-color: #333333;
            --tag-green-bg: rgba(16, 185, 129, 0.2);
            --tag-green-text: #10b981;
            --tag-red-bg: rgba(239, 68, 68, 0.2);
            --tag-red-text: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .control-panel {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        select {
            width: 100%;
            background-color: var(--card-inner);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slider-value {
            font-size: 16px;
            font-weight: 700;
            background-color: var(--card-inner);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 3px;
            outline: none;
            accent-color: #ffffff;
        }

        .chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background-color: var(--card-inner);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .chip.active {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            font-weight: 600;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .metric-title {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            line-height: 1.2;
            font-weight: 700;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .chart-panel {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .chart-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .section-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .spots-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            position: relative;
        }

        .spot-card.within-budget {
            border-left-color: var(--tag-green-text);
        }

        .spot-card.exceeds-budget {
            border-left-color: var(--tag-red-text);
        }

        .spot-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .spot-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .budget-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .budget-tag.within {
            background-color: var(--tag-green-bg);
            color: var(--tag-green-text);
        }

        .budget-tag.exceeds {
            background-color: var(--tag-red-bg);
            color: var(--tag-red-text);
        }

        .spot-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .spot-sub .rating {
            color: #f59e0b;
            font-weight: 600;
        }

        .spot-desc {
            font-size: 13px;
            color: #dddddd;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .spot-footer {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .spot-price {
            font-size: 18px;
            font-weight: 800;
        }

        .spot-impact {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="field-group">
            <label class="field-label">Ciudad de destino</label>
            <select id="citySelect" onchange="updateApp()">
                <option value="Barcelona">Barcelona (España)</option>
                <option value="París">París (Francia)</option>
                <option value="Lyon">Lyon (Francia)</option>
                <option value="Bologna">Bolonia (Italia)</option>
                <option value="Roma">Roma (Italia)</option>
                <option value="San Sebastián">San Sebastián (España)</option>
                <option value="Madrid">Madrid (España)</option>
            </select>
        </div>

        <div class="field-group">
            <div class="slider-header">
                <label class="field-label" style="margin-bottom: 0;">Presupuesto máx. por plato</label>
                <span class="slider-value" id="budgetValue">30 €</span>
            </div>
            <input type="range" id="budgetSlider" min="5" max="80" value="30" oninput="updateApp()">
        </div>

        <div class="field-group" style="margin-bottom: 0;">
            <label class="field-label">Estilo gastronómico</label>
            <div class="chips-grid">
                <div class="chip active" onclick="setStyle(this, 'Todos')">Todos</div>
                <div class="chip" onclick="setStyle(this, 'Local / Tradicional')">Local / Tradicional</div>
                <div class="chip" onclick="setStyle(this, 'Callejero / Rápido')">Callejero / Rápido</div>
                <div class="chip" onclick="setStyle(this, 'Bistró / Casual')">Bistró / Casual</div>
                <div class="chip" onclick="setStyle(this, 'Alta Cocina')">Alta Cocina</div>
            </div>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">OPCIONES ACCESIBLES</div>
            <div class="metric-value" id="accessibleCount">0/0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">COSTE MEDIO EN RANGO</div>
            <div class="metric-value" id="avgCost">0 €</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">IMPACTO DIARIO EST.</div>
            <div class="metric-value" id="dailyImpact">0 €/día</div>
        </div>
    </div>

    <div class="chart-panel">
        <div class="chart-title">COMPARATIVA DE COSTES POR LOCAL VS PRESUPUESTO</div>
        <canvas id="costChart" height="130"></canvas>
    </div>

    <div class="section-header">LUGARES RECOMENDADOS</div>

    <div class="spots-list" id="spotsList"></div>

    <script>
        let selectedStyle = 'Todos';
        let chartInstance = null;

        const database = [
            // BARCELONA
            { name: "Can Paixano (La Xampanyeria)", city: "Barcelona", style: "Callejero / Rápido", price: 12, rating: "4.5", desc: "Bocadillos de lomo/queso acompañados de cava de la casa." },
            { name: "El Xampanyet", city: "Barcelona", style: "Local / Tradicional", price: 22, rating: "4.6", desc: "Anchoas del Cantábrico, cava casero y tapas emblemáticas." },
            { name: "Ciutat Comtal", city: "Barcelona", style: "Local / Tradicional", price: 26, rating: "4.5", desc: "Montaditos frescos y solomillo con foie al momento." },
            { name: "Disfrutar", city: "Barcelona", style: "Alta Cocina", price: 65, rating: "4.9", desc: "Técnicas de vanguardia reconocidas internacionalmente." },

            // PARÍS
            { name: "L'As du Fallafel", city: "París", style: "Callejero / Rápido", price: 12, rating: "4.9", desc: "El pita falafel legendario de Le Marais." },
            { name: "Bouillon Chartier", city: "París", style: "Bistró / Casual", price: 18, rating: "4.6", desc: "Bistró clásico Belle Époque a precios increíbles." },
            { name: "Le Relais de l'Entrecôte", city: "París", style: "Local / Tradicional", price: 32, rating: "4.7", desc: "Famoso steak frites con salsa secreta." },
            { name: "L'Arpège", city: "París", style: "Alta Cocina", price: 75, rating: "4.8", desc: "Alta gastronomía vegetal francesa de tres estrellas." },

            // LYON
            { name: "La Marquise", city: "Lyon", style: "Callejero / Rápido", price: 8, rating: "4.8", desc: "Brioche Praluline de pralinés rosa." },
            { name: "Bouchon Comptoir Brunet", city: "Lyon", style: "Local / Tradicional", price: 28, rating: "4.8", desc: "Bouchon clásico liones con quenelles y charcutería." },
            { name: "Le Kitchen Café", city: "Lyon", style: "Bistró / Casual", price: 35, rating: "4.7", desc: "Cocina de autor estacional y postres refinados." },

            // BOLOGNA
            { name: "Osteria dell'Orsa", city: "Bologna", style: "Callejero / Rápido", price: 14, rating: "4.9", desc: "Tagliatelle al Ragù boloñés tradicional en ambiente rústico." },
            { name: "Sfoglia Rina", city: "Bologna", style: "Bistró / Casual", price: 18, rating: "4.8", desc: "Pasta fresca artesanal elaborada diariamente." },
            { name: "Trattoria di Via Serra", city: "Bologna", style: "Local / Tradicional", price: 32, rating: "4.9", desc: "Platos tradicionales con productos locales seleccionados." },

            // ROMA
            { name: "All'Antico Vinaio", city: "Roma", style: "Callejero / Rápido", price: 10, rating: "4.9", desc: "Schiacciata gigante rellena de pistache y porchetta." },
            { name: "Osteria da Fortunata", city: "Roma", style: "Local / Tradicional", price: 20, rating: "4.9", desc: "Pasta hecha a mano fresca al momento." },
            { name: "Roscioli Salumeria", city: "Roma", style: "Bistró / Casual", price: 42, rating: "4.8", desc: "Carbonara icónica y tabla de quesos y embutidos de alta gama." },

            // SAN SEBASTIÁN
            { name: "La Viña", city: "San Sebastián", style: "Callejero / Rápido", price: 8, rating: "4.9", desc: "Famosa Tarta de Queso Vasca tostada." },
            { name: "Bar Ganbara", city: "San Sebastián", style: "Local / Tradicional", price: 28, rating: "4.9", desc: "Hongos silvestres con yema de huevo y pintxos de autor." },
            { name: "Arzak", city: "San Sebastián", style: "Alta Cocina", price: 75, rating: "4.9", desc: "Alta cocina vasca de investigación vanguardista." },

            // MADRID
            { name: "Casa Labra", city: "Madrid", style: "Callejero / Rápido", price: 9, rating: "4.7", desc: "Croquetas y tajadas de bacalao rebozado desde 1860." },
            { name: "Bodegas El Maño", city: "Madrid", style: "Local / Tradicional", price: 22, rating: "4.6", desc: "Tapas madrileñas caseras y cañas bien tiradas." },
            { name: "DiverXO", city: "Madrid", style: "Alta Cocina", price: 80, rating: "4.9", desc: "Experiencia gastronómica rompedora y surrealista." }
        ];

        function setStyle(element, styleName) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            selectedStyle = styleName;
            updateApp();
        }

        function updateApp() {
            const city = document.getElementById('citySelect').value;
            const maxBudget = parseInt(document.getElementById('budgetSlider').value);
            document.getElementById('budgetValue').innerText = maxBudget + " €";

            const filtered = database.filter(item => {
                const matchCity = item.city === city;
                const matchStyle = selectedStyle === 'Todos' || item.style === selectedStyle;
                return matchCity && matchStyle;
            });

            const accessible = filtered.filter(item => item.price <= maxBudget);
            
            // Métricas
            document.getElementById('accessibleCount').innerText = `${accessible.length}/${filtered.length}`;
            
            const avg = accessible.length > 0 
                ? Math.round(accessible.reduce((sum, item) => sum + item.price, 0) / accessible.length)
                : 0;
            document.getElementById('avgCost').innerText = avg + " €";

            const daily = avg > 0 ? (avg * 2.2).toFixed(0) : 0;
            document.getElementById('dailyImpact').innerText = `${daily} €/día`;

            // Renderizado de tarjetas
            const listContainer = document.getElementById('spotsList');
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color: var(--text-secondary); padding: 20px;">No hay lugares en esta categoría.</div>';
            } else {
                filtered.forEach(item => {
                    const isWithin = item.price <= maxBudget;
                    const card = document.createElement('div');
                    card.className = `spot-card ${isWithin ? 'within-budget' : 'exceeds-budget'}`;
                    
                    card.innerHTML = `
                        <div class="spot-header">
                            <div class="spot-name">${item.name}</div>
                            <span class="budget-tag ${isWithin ? 'within' : 'exceeds'}">
                                ${isWithin ? 'Dentro de presupuesto' : 'Excede presupuesto'}
                            </span>
                        </div>
                        <div class="spot-sub">
                            <span class="rating">★ ${item.rating}</span> • <span>${item.style}</span>
                        </div>
                        <div class="spot-desc">${item.desc}</div>
                        <div class="spot-footer">
                            <div class="spot-price">${item.price} €</div>
                            <div class="spot-impact">Impacto aprox: ~${(item.price * 2.2).toFixed(0)}€/día</div>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }

            // Actualizar Gráfica
            renderChart(filtered, maxBudget);
        }

        function renderChart(data, maxBudget) {
            const ctx = document.getElementById('costChart').getContext('2d');
            
            const labels = data.map(item => item.name.length > 12 ? item.name.substring(0, 10) + '...' : item.name);
            const prices = data.map(item => item.price);
            const backgroundColors = data.map(item => item.price <= maxBudget ? '#60a5fa' : '#94a3b8');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: prices,
                        backgroundColor: backgroundColors,
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.raw} €`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#aaaaaa', font: { size: 10 } },
                            grid: { display: false }
                        },
                        y: {
                            ticks: { color: '#aaaaaa', font: { size: 10 } },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }

        // Inicializar al cargar
        document.addEventListener('DOMContentLoaded', updateApp);
        updateApp();
    </script>
</body>
</html>
